<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4_meses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<meta name="theme-color" content="#D9C2EC">
<meta name="description" content="WinGei 98 — una cápsula del tiempo de 4 meses.">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/windows.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="boot-screen">
  <div>WinGei98 BIOS v4.0<br>(C) cápsula del tiempo, todos los derechos del corazón reservados<br><br></div>
  <div id="boot-lines"></div>
  <div id="boot-bar"><div id="boot-bar-fill"></div></div>
  <div class="boot-caption">cargando 4 meses<span class="blink">_</span></div>
</div>

<main id="desktop">
  <div class="desktop-icons" id="desktop-icons"></div>
</main>

<div id="windows-layer"></div>

<nav id="start-menu" aria-label="Menú de inicio">
  <div class="start-side"><span>WinGei 98</span></div>
  <div class="start-list" id="start-list"></div>
</nav>

<div id="taskbar">
  <button id="start-btn" class="pixel-btn" type="button"><span class="flag">🩷</span><span class="start-label">Inicio</span></button>
  <div class="tb-sep"></div>
  <div id="taskbar-apps"></div>
  <div id="systray"><span id="clock">00:00</span></div>
</div>

<div id="shutdown-screen">
  <div class="big" id="shutdown-msg">Ya puede apagar el equipo.</div>
  <div class="final" id="shutdown-final"></div>
</div>

<div id="toast"></div>

<!-- Orden: efectos → audio → recursos → datos → chrome → apps → escritorio → sistema -->
<script src="js/sound.js" defer></script>
<script src="js/audio.js" defer></script>
<script src="js/assets.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/windowManager.js" defer></script>
<script src="js/apps.js" defer></script>
<script src="js/desktop.js" defer></script>
<script src="js/system.js" defer></script>
</body>
</html>
